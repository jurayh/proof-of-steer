[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-of-steer"
version = "0.1.5"
description = "Local tool that turns an AI coding session or a document's git history into a steering receipt and a steerprint, a map of which parts the human shaped, so a reviewer can price their attention. Steered, not slop."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
keywords = ["ai-agents", "claude-code", "codex", "code-review", "provenance", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://jurayh.github.io/proof-of-steer/"
Repository = "https://github.com/jurayh/proof-of-steer"

[project.scripts]
proof-of-steer = "steering_receipt:main"
steerprint = "steering_viz:main"

[tool.setuptools]
py-modules = ["steering_receipt", "steering_viz", "doc_join", "demo", "capture"]
packages = ["providers"]
